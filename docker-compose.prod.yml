version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: sosguinee_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/mediafiles
    depends_on:
      - web
    restart: always
    
  db:
    image: postgres:15
    container_name: sosguinee_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-sosguinee}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  web:
    build: .
    container_name: sosguinee_web
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=sosguinee.settings_prod
      - ENVIRONMENT=production
      - DEBUG=0
      - SECRET_KEY=${SECRET_KEY}
      - USE_POSTGRES=True
      - POSTGRES_NAME=${POSTGRES_NAME:-sosguinee}
      - POSTGRES_DB=${POSTGRES_DB:-sosguinee}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-127.0.0.1,localhost}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:7400,http://127.0.0.1:7400}
    depends_on:
      - db
    restart: always

volumes:
  pgdata:
  static_volume:
  media_volume:
