name: Deploy to Fly.io

on:
  push:
    branches: ["master"]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    env:
      DJANGO_SETTINGS_MODULE: sosguinee.settings_dev
      SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
      ENVIRONMENT: development
      USE_POSTGRES: "False"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Jazzmin import
        run: python -c "import jazzmin; print('jazzmin import ok')"

      - name: Django check
        run: python manage.py check

      - name: Run tests
        run: python manage.py test page accounts

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: tests
    # Déploie uniquement si les tests passent sur la branche master
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --app sosguinee
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
