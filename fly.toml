# fly.toml - Configuration de déploiement pour Fly.io
# Documentation: https://fly.io/docs/reference/configuration/

app = "sosguinee"
primary_region = "cdg"  # Paris - le plus proche de la Guinée

[build]
  # Utilise notre Dockerfile existant
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  ENVIRONMENT = "production"
  DEBUG = "0"
  USE_POSTGRES = "True"
  DJANGO_SETTINGS_MODULE = "sosguinee.settings_prod"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[processes]
  app = "/app/entrypoint.sh"

[[statics]]
  guest_path = "/app/staticfiles"
  url_prefix = "/static"

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "30s"
    method = "get"
    path = "/"
    port = 8000
    timeout = "10s"
    type = "http"
