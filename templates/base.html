{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SOS Guinée{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
     <!--Import materialize.css-->
     <link type="text/css" rel="stylesheet" href="{% static 'materialize/css/materialize.min.css' %}"  media="screen,projection"/>
     <style>

    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    {% block extracss %}{% endblock %}
    {% block extra_head %}{% endblock %}
     <!-- jquery link -->
    <style>

        .hero {
            position: relative;
            background: url("{% static 'img/articles/img7.avif' %}") center/cover no-repeat;
            min-height: 60vh; /* Hauteur minimale responsive */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1rem;
            overflow: hidden;
        }

        /* Overlay sombre pour améliorer la lisibilité */
        .hero::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        /* Tous les enfants directs de .hero se positionnent au-dessus de l’overlay */
        .hero > * {
            position: relative;
            z-index: 1;
            width: 100%;
        }

        /* Titre principal */
        .hero h1 {
            color: #ffffff;
            font-weight: 700;
            font-size: 2.5rem;
            line-height: 1.2;
            margin: 1rem 0 0.5rem;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.6);
        }

        /* Sous-titre (h5) */
        .hero h5 {
            color: #f0f0f0;
            font-weight: 500;
            font-size: 1.25rem;
            margin-bottom: 1rem;
            line-height: 1.3;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        /* Paragraphe descriptif */
        .hero p {
            color: #e0e0e0;
            font-size: 1rem;
            max-width: 600px;
            margin: 0 auto 1.5rem;
            line-height: 1.6;
        }

        /* Bouton "Nous contacter" */
        .hero .btn {
            font-size: 1rem;
            padding: 0 2rem;
            margin-bottom: 2rem;
        }

        /* Classe utilitaire pour tronquer le texte à 3 lignes */
        .truncate-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }



        html, body {
            height: 100%;
            margin: 0;
        }

        .main-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }
    </style>
</head>
<body>
<div class="main-wrapper">
    {% include 'page/components/nav.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'page/components/footer.html' %}
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
 <script>
      document.addEventListener('DOMContentLoaded', function() {
        M.AutoInit();
      });

        document.addEventListener('DOMContentLoaded', function() {
            var elems = document.querySelectorAll('.sidenav');
            M.Sidenav.init(elems);
            var modals = document.querySelectorAll('.modal');
            M.Modal.init(modals);
        });

          document.addEventListener('DOMContentLoaded', function() {
          const elems = document.querySelectorAll('.dropdown-trigger');
          M.Dropdown.init(elems, {
          coverTrigger: false,
          constrainWidth: false
      });
      });

</script>
      {% block extrajs %}
    {% endblock %}
    
</body>
</html>
