{% extends 'base.html' %}
{% block title %}Email envoyé{% endblock %}
{% block content %}
<main class="section container">
  <div class="card">
    <div class="card-content">
      <span class="card-title">Vérifiez votre boîte mail</span>

        <a class="btn" href="{% url 'login' %}">Retour connexion</a>

  </div>
</main>
{% endblock %}
