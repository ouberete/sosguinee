upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name 18.170.114.4;

    # Allow larger uploads (default is 1M which causes 413)
    client_max_body_size 10M;

    location /static/ {
        alias /app/staticfiles/;
    }

    # Documents personnels (pièces d'identité...): accès contrôlé par Django,
    # jamais servis directement. ^~ prime sur le préfixe /media/ ci-dessous.
    location ^~ /media/user_images/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /app/mediafiles/;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
