<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Activation du compte</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f6f6f6; margin: 0; padding: 0;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
        <tr>
            <td align="center" style="padding: 40px 10px;">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" style="background-color: #ffffff; border-radius: 8px; padding: 30px;">
                    <tr>
                        <td style="font-size: 20px; font-weight: bold; color: #333333; padding-bottom: 20px;">
                            Activation de votre compte
                        </td>
                    </tr>
                    <tr>
                        <td style="font-size: 16px; color: #333333;">
                            Bonjour <strong>{{ user.username }}</strong>,
                        </td>
                    </tr>
                    <tr>
                        <td style="font-size: 16px; color: #333333; padding: 20px 0;">
                            Merci pour votre inscription. Pour activer votre compte, veuillez cliquer sur le bouton ci-dessous :
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding: 10px 0 30px;">
                            <a href="{{ protocol }}://{{ domain }}{% url 'activate' uidb64=uid token=token %}" style="background-color: #2196F3; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 5px; display: inline-block;">
                                Activer mon compte
                            </a>
                        </td>
                    </tr>
                    <tr>
                        <td style="font-size: 14px; color: #666666;">
                            Si vous n'avez pas demandé cette inscription, veuillez ignorer cet e-mail.
                        </td>
                    </tr>
                    <tr>
                        <td style="font-size: 14px; color: #666666; padding-top: 20px;">
                            Merci,<br>
                            L'équipe de {{ domain }}
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
