{% extends 'base.html' %}
{% block title %}Confirmer la suppression{% endblock %}
{% block content %}
<main class="section container">
  <div class="card">
    <div class="card-content">
      <span class="card-title">Confirmer la suppression</span>
      <p>Êtes-vous sûr de vouloir supprimer cet élément ? Cette action peut être réversible (suppression logique).</p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn red">Supprimer</button>
        <a href="{% url 'profile' %}" class="btn-flat">Annuler</a>
      </form>
    </div>
  </div>
  
</main>
{% endblock %}
