{% load static %}
<section id="contact-us" class="section card">
  <div class="container">
    <h4 class="center-align">Nous contacter</h4>
    <div class="row">
      <div class="col s12 m6">
        <div class="card-panel">
          <h5>Besoin d'informations ?</h5>
          <p>Veuillez remplir le formulaire ci-dessous et nous vous répondrons dans les plus brefs délais.</p>
        </div>
      </div>
      <div class="col s12 m6">
        <form action="{% url 'contact' %}" method="POST" id="contact-form">
          {% csrf_token %}
          <div class="input-field">
            <input type="text" id="name" name="name" required>
            <label for="name">Nom</label>
          </div>
          <div class="input-field">
            <input type="email" id="email" name="email" required>
            <label for="email">Email</label>
          </div>
          <div class="input-field">
            <textarea id="message" class="materialize-textarea" name="message" required></textarea>
            <label for="message">Message</label>
          </div>
          <div class="row valign-wrapper" id="loader" style="display: none;">
            <div class="col s6">
              <span>Patientez...</span>
            </div>
            <div class="col s6">
              <div class="preloader-wrapper small active">
                <div class="spinner-layer spinner-blue-only">
                  <div class="circle-clipper left"><div class="circle"></div></div>
                  <div class="gap-patch"><div class="circle"></div></div>
                  <div class="circle-clipper right"><div class="circle"></div></div>
                </div>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col s6">
              <button type="submit" class="btn blue darken-2 waves-effect waves-light">Envoyer</button>
            </div>
            <div class="col s6">
              <div id="message-success" class="green-text"></div>
              <div id="message-error" class="red-text"></div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
