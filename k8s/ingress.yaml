# Exposition HTTPS via ingress-nginx + cert-manager (Let's Encrypt).
# Prérequis dans le cluster:
#   - ingress-nginx    : https://kubernetes.github.io/ingress-nginx/
#   - cert-manager     : https://cert-manager.io  (+ un ClusterIssuer "letsencrypt-prod")
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sosguinee
  namespace: sosguinee
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Taille max des uploads (images, documents) — aligné sur nginx.conf
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        # ⚠️ Votre domaine réel
        - sosguinee.example.com
      secretName: sosguinee-tls
  rules:
    - host: sosguinee.example.com
      http:
        paths:
          # Fichiers uploadés (servis par le nginx media, PVC en lecture seule)
          - path: /media/
            pathType: Prefix
            backend:
              service:
                name: sosguinee-media
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sosguinee-web
                port:
                  number: 80
