# Exposition HTTPS via ingress-nginx + cert-manager (Let's Encrypt).
# Prérequis dans le cluster:
#   - ingress-nginx    : https://kubernetes.github.io/ingress-nginx/
#   - cert-manager     : https://cert-manager.io  (+ un ClusterIssuer "letsencrypt-prod")
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sosguinee
  namespace: sosguinee
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Taille max des uploads (images, documents) — aligné sur nginx.conf
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        # ⚠️ Votre domaine réel
        - sosguinee.example.com
      secretName: sosguinee-tls
  rules:
    - host: sosguinee.example.com
      http:
        paths:
          # Documents personnels (pièces d'identité): stockés dans le bucket
          # PRIVÉ, servis uniquement par la vue Django gardée. Le storage privé
          # renvoie /media/user_images/... -> cette route -> service web.
          - path: /media/user_images/
            pathType: Prefix
            backend:
              service:
                name: sosguinee-web
                port:
                  number: 80
          # Les autres médias (images d'alertes/financements) sont servis
          # directement par le bucket PUBLIC S3/Object Storage: plus de serveur
          # média in-cluster ni de PVC.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sosguinee-web
                port:
                  number: 80
