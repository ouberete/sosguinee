# Worker Celery: emails asynchrones (files default + email).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ensemble224-celery-worker
  namespace: ensemble224
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ensemble224-celery-worker
  template:
    metadata:
      labels:
        app: ensemble224-celery-worker
    spec:
      containers:
        - name: worker
          # ⚠️ Même image et même tag que web
          image: REGISTRY/ensemble224:latest
          command:
            - celery
            - -A
            - ensemble224
            - worker
            - -l
            - info
            - -Q
            - default,email
            - --concurrency=2
          envFrom:
            - configMapRef:
                name: ensemble224-config
            - secretRef:
                name: ensemble224-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - celery -A ensemble224 inspect ping -d celery@$HOSTNAME --timeout 10
            initialDelaySeconds: 60
            periodSeconds: 120
            timeoutSeconds: 15
