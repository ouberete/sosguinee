# PostgreSQL auto-hébergé dans le cluster.
#
# ⚠️ Recommandation: pour une vraie production, préférez une base MANAGÉE
# (Scaleway, OVH, AWS RDS, Neon…) — sauvegardes, réplication et mises à jour
# gérées pour vous. Dans ce cas, supprimez ce fichier et pointez
# POSTGRES_HOST / DATABASE_URL vers la base managée.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sosguinee
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sosguinee
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: sosguinee-config
                  key: POSTGRES_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: sosguinee-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sosguinee-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sosguinee"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "sosguinee"]
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
        # storageClassName: <classe de votre fournisseur si nécessaire>
