# Déploiement d'un coup: kubectl apply -k k8s/
# (le Secret n'est PAS inclus: créez-le d'abord — voir secret.example.yaml.
#  Le Job de migration se lance séparément à chaque déploiement.)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ensemble224

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - web.yaml
  - celery-worker.yaml
  - celery-beat.yaml
  - ingress.yaml
  - hpa.yaml
  - backup-cronjob.yaml

# Pour changer l'image et le tag en une seule commande:
#   kustomize edit set image REGISTRY/ensemble224=ghcr.io/mon-org/ensemble224:v1.2.3
images:
  - name: REGISTRY/ensemble224
    newName: REGISTRY/ensemble224
    newTag: latest
