# Planificateur Celery Beat: rappels d'abonnements, nettoyages périodiques.
# ⚠️ TOUJOURS 1 seule réplique (sinon les tâches planifiées partent en double).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ensemble224-celery-beat
  namespace: ensemble224
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ensemble224-celery-beat
  template:
    metadata:
      labels:
        app: ensemble224-celery-beat
    spec:
      containers:
        - name: beat
          # ⚠️ Même image et même tag que web
          image: REGISTRY/ensemble224:latest
          command:
            - celery
            - -A
            - ensemble224
            - beat
            - -l
            - info
          envFrom:
            - configMapRef:
                name: ensemble224-config
            - secretRef:
                name: ensemble224-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
