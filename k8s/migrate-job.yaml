# Job de migration: à lancer à chaque déploiement AVANT la mise à jour
# des Deployments (ou via un pipeline CI/CD).
#
#   kubectl -n ensemble224 delete job ensemble224-migrate --ignore-not-found
#   kubectl -n ensemble224 apply -f k8s/migrate-job.yaml
#   kubectl -n ensemble224 wait --for=condition=complete job/ensemble224-migrate --timeout=300s
apiVersion: batch/v1
kind: Job
metadata:
  name: ensemble224-migrate
  namespace: ensemble224
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: ensemble224-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          # ⚠️ Remplacez par votre image (même tag que web/worker/beat)
          image: REGISTRY/ensemble224:latest
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: ensemble224-config
            - secretRef:
                name: ensemble224-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
