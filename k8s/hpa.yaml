# Autoscaling horizontal du serveur web (optionnel — nécessite metrics-server).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sosguinee-web
  namespace: sosguinee
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sosguinee-web
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
