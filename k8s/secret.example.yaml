# ⚠️ MODÈLE — ne JAMAIS committer le vrai fichier de secrets.
#
# Méthode recommandée (sans fichier intermédiaire) :
#
#   kubectl -n sosguinee create secret generic sosguinee-secrets \
#     --from-literal=SECRET_KEY='<50+ caractères aléatoires>' \
#     --from-literal=POSTGRES_PASSWORD='<mot de passe fort>' \
#     --from-literal=EMAIL_HOST_USER='notifications@votre-domaine.com' \
#     --from-literal=EMAIL_HOST_PASSWORD='<mot de passe application>' \
#     --from-literal=CONTACT_NOTIFY_EMAIL='equipe@votre-domaine.com' \
#     --from-literal=DJOMY_CLIENT_ID='<client id Djomy>' \
#     --from-literal=DJOMY_CLIENT_SECRET='<secret HMAC Djomy>' \
#     --from-literal=DJOMY_WEBHOOK_SECRET='<secret webhook Djomy>' \
#     --from-literal=TURNSTILE_SITE_KEY='<clé site Cloudflare>' \
#     --from-literal=TURNSTILE_SECRET_KEY='<clé secrète Cloudflare>' \
#     --from-literal=SENTRY_DSN='<dsn sentry ou vide>'
#
# Pour un vrai workflow GitOps, préférez SealedSecrets ou External Secrets
# Operator plutôt qu'un Secret en clair dans le dépôt.
apiVersion: v1
kind: Secret
metadata:
  name: sosguinee-secrets
  namespace: sosguinee
type: Opaque
stringData:
  SECRET_KEY: "CHANGEZ-MOI"
  POSTGRES_PASSWORD: "CHANGEZ-MOI"
  EMAIL_HOST_USER: "CHANGEZ-MOI"
  EMAIL_HOST_PASSWORD: "CHANGEZ-MOI"
  CONTACT_NOTIFY_EMAIL: "CHANGEZ-MOI"
  DJOMY_CLIENT_ID: "CHANGEZ-MOI"
  DJOMY_CLIENT_SECRET: "CHANGEZ-MOI"
  DJOMY_WEBHOOK_SECRET: "CHANGEZ-MOI"
  TURNSTILE_SITE_KEY: ""
  TURNSTILE_SECRET_KEY: ""
  SENTRY_DSN: ""
